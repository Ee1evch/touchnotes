name: Сборка и публикация APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Аудит отсутствия секретных ключей в репозитории
        run: |
          UNAUTHORIZED=$(find . -name "*.keystore" -o -name "*.jks" | grep -v "^\./app/debug.keystore$" || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "::error::Обнаружены непредусмотренные файлы keystore/jks в репозитории: $UNAUTHORIZED"
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Юнит-тесты
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :parent:testDebugUnitTest :core:test

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            parent/build/reports/tests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.ref_name == 'codex/nastavnik-151' && '151' || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Аудит отсутствия секретных ключей в репозитории
        run: |
          UNAUTHORIZED=$(find . -name "*.keystore" -o -name "*.jks" | grep -v "^\./app/debug.keystore$" || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "::error::Обнаружены непредусмотренные файлы keystore/jks в репозитории: $UNAUTHORIZED"
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка релизных APK
        run: GITHUB_RUN_NUMBER="$BUILD_NUMBER" ./gradlew --no-daemon assembleRelease

      - name: Подготовка тестовых APK (подпись debug-ключом)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEY="--ks app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android"
          sign() {
            "$BT/apksigner" sign $KEY --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$2" "$1"
            echo "== $2"; "$BT/apksigner" verify -v --min-sdk-version 21 "$2" | grep -E "Verified using v[123] "
          }
          sign app/build/outputs/apk/full/release/app-full-release.apk nastavnik-debug.apk
          sign app/build/outputs/apk/student/release/app-student-release.apk student-debug.apk
          sign parent/build/outputs/apk/release/parent-release.apk parent-debug.apk
          sha256sum nastavnik-debug.apk student-debug.apk parent-debug.apk > sha256sums-debug.txt
          cat sha256sums-debug.txt

      - name: Артефакты для тестирования
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            nastavnik-debug.apk
            student-debug.apk
            parent-debug.apk
            sha256sums-debug.txt
          if-no-files-found: error

      - name: Неподписанные APK для публикации
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: |
            app/build/outputs/apk/full/release/app-full-release.apk
            app/build/outputs/apk/student/release/app-student-release.apk
            parent/build/outputs/apk/release/parent-release.apk
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Аудит отсутствия секретных ключей в репозитории
        run: |
          UNAUTHORIZED=$(find . -name "*.keystore" -o -name "*.jks" | grep -v "^\./app/debug.keystore$" || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "::error::Обнаружены непредусмотренные файлы keystore/jks в репозитории: $UNAUTHORIZED"
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Тесты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  publish:
    needs: [test, build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Скачивание APK из job build
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apks

      - name: Подпись релизным ключом и сверка сертификата
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 || vars.EXPECTED_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Секреты RELEASE_KEYSTORE_* не заданы в репозитории! Публикация отменена (debug-fallback никогда не публикуется в релиз)."
            exit 1
          fi

          if [ -z "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Секрет EXPECTED_RELEASE_CERT_SHA256 не задан! Публикация отменена."
            exit 1
          fi

          # Keystore во временной папке runner-а с trap-очисткой
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TMP_DIR/release.keystore"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          EXPECTED_NORM=$(echo "$EXPECTED_RELEASE_CERT_SHA256" | tr -d ' :' | tr '[:upper:]' '[:lower:]')

          sign_release() {
            local in_apk="$1"
            local out_apk="$2"
            "$BT/apksigner" sign \
              --ks "$TMP_DIR/release.keystore" \
              --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --key-pass "pass:$RELEASE_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$out_apk" "$in_apk"

            echo "== Проверка подписи $out_apk =="
            "$BT/apksigner" verify -v --min-sdk-version 21 "$out_apk" | grep -E "Verified using v[123] "

            echo "== Сверка отпечатка сертификата $out_apk =="
            ACTUAL_CERT=$("$BT/apksigner" verify --print-certs "$out_apk" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
            if [ -z "$ACTUAL_CERT" ] || [ "$ACTUAL_CERT" != "$EXPECTED_NORM" ]; then
              echo "::error::Несовпадение отпечатка сертификата $out_apk! Получен: '$ACTUAL_CERT', ожидался: '$EXPECTED_NORM'"
              exit 1
            fi
            echo "Отпечаток сертификата совпадает: $ACTUAL_CERT"
          }

          sign_release app-full-release.apk nastavnik.apk
          sign_release app-student-release.apk student.apk
          sign_release parent-release.apk parent.apk

          sha256sum nastavnik.apk student.apk parent.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Публикация GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            [ -z "$VERSION_NAME" ] && VERSION_NAME="1.1.13"
            TAG="v$VERSION_NAME"
          fi
          SHA_BODY=$(cat sha256sums.txt)
          RELEASE_NOTES=$(printf "Релиз %s (коммит %s)\n\nХеши SHA-256:\n%s" "$TAG" "${{ github.sha }}" "$SHA_BODY")
          gh release create "$TAG" nastavnik.apk student.apk parent.apk sha256sums.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Наставник $TAG" \
            --notes "$RELEASE_NOTES" \
            --latest || {
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Наставник $TAG" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release upload "$TAG" nastavnik.apk student.apk parent.apk sha256sums.txt \
              --repo "${{ github.repository }}" \
              --clobber
          }

      - name: Загрузка подписанных релизных APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: published-release-apks
          path: |
            nastavnik.apk
            student.apk
            parent.apk
            sha256sums.txt
          if-no-files-found: error
