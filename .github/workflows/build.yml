name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.ref_name == 'codex/nastavnik-150' && '150' || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK на раннере ubuntu уже установлен ($ANDROID_HOME);
      # недостающую платформу Android Gradle Plugin докачает сам.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Юнит-тесты
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :parent:testDebugUnitTest :core:test

      # Релизные сборки (не отладочные) — их ставит любой телефон с Android 10+.
      - name: Сборка релизных APK
        run: GITHUB_RUN_NUMBER="$BUILD_NUMBER" ./gradlew --no-daemon assembleRelease

      # Подпись всеми схемами (v1+v2+v3) тем же ключом, что раньше: такой APK принимает любой установщик
      # Android 10+, а обновление поверх работает. Проверка подписи — в лог.
      - name: APK для релиза (подпись v1+v2+v3)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEY="--ks app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android"
          sign() {
            "$BT/apksigner" sign $KEY --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$2" "$1"
            echo "== $2"; "$BT/apksigner" verify -v --min-sdk-version 21 "$2" | grep -E "Verified using v[123] "
          }
          sign app/build/outputs/apk/full/release/app-full-release.apk nastavnik.apk
          sign app/build/outputs/apk/student/release/app-student-release.apk student.apk
          sign parent/build/outputs/apk/release/parent-release.apk parent.apk

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            parent/build/reports/tests/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            nastavnik.apk
            student.apk
            parent.apk
          if-no-files-found: error

      # Каждая сборка из push — релиз build-<номер> с APK: по нему приложение находит обновление
      # («Настройки → Обновления») и ставит поверх, а по ссылке releases/latest всегда свежий APK.
      - name: Релиз для обновления из приложения
        if: github.event_name == 'push'
        # Нет прав на релизы (форк, ограничения организации) — сборка всё равно зелёная.
        continue-on-error: ${{ github.ref_name != 'codex/nastavnik-150' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$BUILD_NUMBER" nastavnik.apk student.apk parent.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Наставник 1.5, сборка $BUILD_NUMBER" \
            --notes "Ветка ${{ github.ref_name }}, коммит ${{ github.sha }}" \
            --latest

  # Проверки на эмуляторе планшета: экспорт PDF, плавающая кнопка, стилус, панель, снимок экрана.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Тесты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
