<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --bg: #fafbff;
    --text: #1c2033;
    --muted: #626a85;
    --accent: #3d5afe;
    --user-bg: #e8ecff;
    --bot-bg: #ffffff;
    --border: #dde2f0;
    --error-bg: #fdecec;
    --error-text: #a12121;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Roboto", "Noto Sans", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 10px 12px 16px;
    -webkit-text-size-adjust: 100%;
    overflow-wrap: anywhere;
  }
  #empty { color: var(--muted); text-align: center; margin-top: 24px; font-size: 15px; }
  #empty b { color: var(--text); }
  .msg { margin: 8px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 92%;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--bot-bg);
    border: 1px solid var(--border);
  }
  .user .bubble { background: var(--user-bg); border-color: transparent; border-bottom-right-radius: 4px; }
  .assistant .bubble { border-bottom-left-radius: 4px; }
  .error .bubble { background: var(--error-bg); color: var(--error-text); border-color: transparent; }
  .shot { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .bubble p { margin: 0.35em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0.3em 0; padding-left: 1.3em; }
  .bubble code { background: #f1f3f9; padding: 0 3px; border-radius: 3px; font-size: 0.92em; }
  .bubble pre { background: #f1f3f9; padding: 8px; border-radius: 6px; overflow-x: auto; }
  .math-block { overflow-x: auto; overflow-y: hidden; margin: 0.4em 0; }
  .katex-display { margin: 0.3em 0; }
  .katex { font-size: 1.08em; }
  .typing::after {
    content: "▍";
    color: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  .thinking { color: var(--muted); font-style: italic; }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<div id="empty">Нажми <b>«Подскажи следующий шаг»</b> или задай вопрос.<br>Наставник посмотрит на экран и подскажет, но не решит за тебя.</div>
<div id="list"></div>
<script src="katex/katex.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="rich.js"></script>
<script>
(function () {
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var nodes = {};

  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  }
  function scrollDown() { window.scrollTo(0, document.body.scrollHeight); }

  function fill(node, m) {
    node.className = 'msg ' + m.role + (m.error ? ' error' : '');
    var bubble = node.firstChild;
    var html = '';
    if (m.role === 'user' && m.hadImage) html += '<div class="shot">📷 со снимком экрана</div>';
    if (m.role === 'assistant' && m.streaming && !m.text) {
      html += '<span class="thinking">' + (m.status || 'Наставник думает…') + '</span>';
    } else if (m.role === 'user') {
      html += Rich.escape(m.text).replace(/\n/g, '<br>');
    } else {
      html += Rich.render(m.text, false);
    }
    bubble.innerHTML = html;
    bubble.classList.toggle('typing', !!(m.streaming && m.text));
  }

  function upsert(m) {
    var stick = nearBottom();
    var node = nodes[m.id];
    if (!node) {
      node = document.createElement('div');
      node.appendChild(document.createElement('div')).className = 'bubble';
      nodes[m.id] = node;
      list.appendChild(node);
      stick = true;
    }
    fill(node, m);
    empty.style.display = 'none';
    if (stick) scrollDown();
  }

  window.Chat = {
    setMessages: function (arr) {
      list.innerHTML = '';
      nodes = {};
      arr.forEach(upsert);
      empty.style.display = arr.length ? 'none' : 'block';
      scrollDown();
    },
    upsert: upsert,
    remove: function (id) {
      var node = nodes[id];
      if (node) { node.remove(); delete nodes[id]; }
      empty.style.display = list.children.length ? 'none' : 'block';
    }
  };
  if (window.NativeChat) NativeChat.onReady();
})();
</script>
</body>
</html>
