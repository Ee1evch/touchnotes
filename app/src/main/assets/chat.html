<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  @font-face { font-family: "Onest"; src: url("fonts/Onest-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Onest"; src: url("fonts/Onest-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Onest"; src: url("fonts/Onest-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Onest"; src: url("fonts/Onest-Bold.ttf"); font-weight: 700; }
  /* Оформление в духе Gemini: ответ без «пузыря», вопрос — в серой пилюле справа. */
  :root {
    --text: #16161a;
    --muted: #5e5d66;
    --user-bg: #f1efea;
    --error-bg: #fdecec;
    --error-text: #c8333a;
    --code-bg: #f1efea;
  }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text); }
  body {
    font-family: "Onest", "Roboto", "Noto Sans", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    padding: 4px 4px 6px;
    -webkit-text-size-adjust: 100%;
    overflow-wrap: anywhere;
  }
  #list { display: flow-root; }
  .msg { margin: 10px 0; display: flex; gap: 10px; }
  .msg.user { justify-content: flex-end; }
  .avatar { flex: 0 0 22px; height: 22px; margin-top: 2px; }
  .avatar svg { width: 22px; height: 22px; }
  .msg.assistant.streaming .avatar svg { animation: spin 1.6s linear infinite; }
  .bubble { min-width: 0; }
  .user .bubble {
    max-width: 85%;
    background: var(--user-bg);
    padding: 9px 16px;
    border-radius: 22px 22px 6px 22px;
  }
  .assistant .bubble { flex: 1; padding-top: 1px; }
  .error .bubble {
    flex: 1;
    background: var(--error-bg);
    color: var(--error-text);
    padding: 9px 16px;
    border-radius: 18px;
  }
  .shot { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .bubble p { margin: 0.35em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0.3em 0; padding-left: 1.3em; }
  .bubble code { background: var(--code-bg); padding: 0 4px; border-radius: 4px; font-size: 0.92em; }
  .bubble pre { background: var(--code-bg); padding: 10px; border-radius: 12px; overflow-x: auto; }
  .math-block { overflow-x: auto; overflow-y: hidden; margin: 0.4em 0; }
  .katex-display { margin: 0.3em 0; }
  .katex { font-size: 1.08em; }
  /* «Думаю…» переливается графитовым бликом */
  .thinking {
    font-weight: 500;
    background: linear-gradient(90deg, #2c2c33, #9a9aa6, #2c2c33);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 2.2s linear infinite;
  }
  .typing::after {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-left: 4px;
    border-radius: 50%;
    background: #2c2c33;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes shimmer { to { background-position: -300% 0; } }
  @keyframes pulse { 50% { opacity: 0.3; transform: scale(0.7); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="list"></div>
<script src="katex/katex.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="rich.js"></script>
<script>
(function () {
  var list = document.getElementById('list');
  var nodes = {};
  var SPARK = '<svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">' +
    '<stop offset="0" stop-color="#16161A"/><stop offset="1" stop-color="#4A4A55"/>' +
    '</linearGradient></defs><path fill="url(#g)" d="M12,1.5C12.7,7.2 16.8,11.3 22.5,12C16.8,12.7 12.7,16.8 12,22.5C11.3,16.8 7.2,12.7 1.5,12C7.2,11.3 11.3,7.2 12,1.5Z"/></svg>';

  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  }
  function scrollDown() { window.scrollTo(0, document.body.scrollHeight); }

  // Сообщаем приложению высоту переписки — карточка растёт вместе с ней.
  var lastH = -1;
  function reportHeight() {
    var h = Math.ceil(list.getBoundingClientRect().height) + 12;
    if (h !== lastH && window.NativeChat && NativeChat.onHeight) {
      lastH = h;
      NativeChat.onHeight(h);
    }
  }
  if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(list);

  function fill(node, m) {
    var isBot = m.role === 'assistant';
    node.className = 'msg ' + m.role + (m.error ? ' error' : '') + (m.streaming ? ' streaming' : '');
    var html = '';
    if (m.role === 'user' && m.hadImage) html += '<div class="shot">📷 со снимком экрана</div>';
    if (isBot && m.streaming && !m.text) {
      html += '<span class="thinking">' + (m.status || 'Наставник думает…') + '</span>';
    } else if (m.role === 'user') {
      html += Rich.escape(m.text).replace(/\n/g, '<br>');
    } else {
      html += Rich.render(m.text, false);
    }
    node.innerHTML = (isBot && !m.error ? '<div class="avatar">' + SPARK + '</div>' : '') +
      '<div class="bubble' + (m.streaming && m.text ? ' typing' : '') + '">' + html + '</div>';
  }

  function upsert(m) {
    var stick = nearBottom();
    var node = nodes[m.id];
    if (!node) {
      node = document.createElement('div');
      nodes[m.id] = node;
      list.appendChild(node);
      stick = true;
    }
    fill(node, m);
    if (stick) scrollDown();
    reportHeight();
  }

  window.Chat = {
    setMessages: function (arr) {
      list.innerHTML = '';
      nodes = {};
      arr.forEach(upsert);
      scrollDown();
      reportHeight();
    },
    upsert: upsert,
    remove: function (id) {
      var node = nodes[id];
      if (node) { node.remove(); delete nodes[id]; }
      reportHeight();
    }
  };
  if (window.NativeChat) NativeChat.onReady();
})();
</script>
</body>
</html>
